    {id:'p4', type:'multi', text:'O que você mais quer aprender antes do bebê chegar?', hint:'Pode marcar mais de uma', options:[
      {v:'pega_nao_doer', label:'Como fazer a pega certa pra não doer'},
      {v:'garantir_leite', label:'Como garantir que vou ter leite'},
      {v:'saber_suficiente', label:'Como saber se ele está mamando o suficiente'},
      {v:'cuidar_rn', label:'Como cuidar do recém-nascido sem entrar em pânico'},
    ]},
  ],
};

/* ============================ ROTEAMENTO ================================ */

/* Fluxo 2: "bebê está bem?" (base pra Categoria 1 quando é só peito) */
function bebeBemRN(a){
  const p3bom = has(a.p3,'solta_satisfeito') && !any(a.p3,['dorme_rapido','horas_peito','larga_quer','briga']);
  const fraldaOk = a.p4==='f6_8' || a.p4==='mais8';
  const pesoOk = a.p5==='bem' || a.p5==='super_bem';
  const seioOk = !any(a.p6,['doendo','rachadura','sangrando','empedrados','raynaud','silicone','sensiveis']);
  return p3bom && fraldaOk && pesoOk && seioOk && a.p7!=='sim' && a.p8!=='sim';
}
/* Fluxo 2: categoria (1 = bebê bem/sono, 2 = média, 3 = alta) */
function categoriaRN(a){
  if(a.p2==='peito_formula'){
    return (a.p2b==='f5_8' || a.p2b==='f8_10') ? 'cat3' : 'cat2';
  }
  if(a.p2==='so_formula'){
    return a.p2c==='sim' ? 'cat3' : 'cat1';   // não quer voltar -> caminho sono
  }
  // só peito
  return bebeBemRN(a) ? 'cat1' : 'cat2';
}

/* Mapa de desfechos -> rótulo + caminho (oferta). O texto completo mora no site de resposta. */
const DESFECHOS = {
  // Fluxo 2
  rn_formula_sono:   {emoji:'💚', titulo:'Seu bebê está bem alimentado', caminho:'Sono do bebê', oferta:'Dream Baby'},
  rn_cat1_dormebem:  {emoji:'🎉', titulo:'Mama e dorme muito bem!', caminho:'Estímulo ao desenvolvimento', oferta:'Entre Sonecas'},
  rn_cat1_sono:      {emoji:'🌙', titulo:'A amamentação vai bem, o ponto é o sono', caminho:'Sono do bebê', oferta:'Dream Baby'},
  rn_cat2_guia:      {emoji:'🤱', titulo:'Dá pra deixar a mamada bem mais fácil', caminho:'Ajuste da pega', oferta:'Guia da Pega'},
  rn_cat2_silicone:  {emoji:'🛡️', titulo:'Vamos tirar o silicone com segurança', caminho:'Ajuste da pega', oferta:'Guia da Pega + Pesque Baby'},
  rn_cat3_acomp:     {emoji:'🤝', titulo:'Vale uma mão mais próxima pra reverter', caminho:'Ajuste + acompanhamento', oferta:'Guia da Pega + Acompanhamento'},
  // Fluxo 3
  m_guia_acomp:      {emoji:'🤝', titulo:'Dá pra voltar ao peito com apoio de perto', caminho:'Ajuste + acompanhamento', oferta:'Guia da Pega + Acompanhamento'},
  m_guia:            {emoji:'🤱', titulo:'Um ajuste resolve o que está te incomodando', caminho:'Ajuste da pega', oferta:'Guia da Pega'},
  m_guia_pesque:     {emoji:'🛡️', titulo:'Vamos tirar o silicone com segurança', caminho:'Ajuste da pega', oferta:'Guia da Pega + Pesque Baby'},
  m_sono:            {emoji:'🌙', titulo:'É sono, não amamentação', caminho:'Sono do bebê', oferta:'Dream Baby'},
  m_tudo_bem:        {emoji:'🎉', titulo:'Está tudo indo muito bem!', caminho:'Estímulo ao desenvolvimento', oferta:'Entre Sonecas'},
  // Fluxo 4
  m6_tudo_dez:       {emoji:'🎉', titulo:'Está tudo perfeitinho!', caminho:'Parabéns, sem oferta', oferta:'—'},
  m6_intro:          {emoji:'🍽️', titulo:'É a fase da introdução, fica tranquila', caminho:'Orientação', oferta:'—'},
  m6_cruzamento:     {emoji:'🥛', titulo:'Vamos repor o leite do dia', caminho:'Ajuste + sono se persistir', oferta:'Dream Baby'},
  m6_sono:           {emoji:'🌙', titulo:'É sono, não amamentação', caminho:'Sono do bebê', oferta:'Dream Baby'},
  // Fluxo 1
  g_guia:            {emoji:'💚', titulo:'Você vai chegar preparada', caminho:'Preparação pra amamentar', oferta:'Guia da Pega'},
  g_guia_calminho:   {emoji:'💚', titulo:'Preparada pra amamentar e pros primeiros dias', caminho:'Preparação', oferta:'Guia da Pega + Bebê Calminho'},
};

function roteia(flow, a){
  if(flow==='rn'){
    const cat = categoriaRN(a);
    if(cat==='cat3') return 'rn_cat3_acomp';
    if(cat==='cat2') return has(a.p6,'silicone') ? 'rn_cat2_silicone' : 'rn_cat2_guia';
    // cat1
    if(a.p2==='so_formula') return 'rn_formula_sono';
    return a.p10==='dorme_bem' ? 'rn_cat1_dormebem' : 'rn_cat1_sono';
  }
  if(flow==='m1a5'){
    if(a.p2c==='sim') return 'm_guia_acomp';
    if(a.p2b==='f5_8' || a.p2b==='f8_10') return 'm_guia_acomp';
    if(a.p8b==='sim') return 'm_guia_pesque';
    const baixoPeso = a.p7==='pouco_abaixo' || a.p7==='bem_abaixo';
    const queixaProd = any(a.p6,['producao','nao_sei_suficiente']);
    const media = a.p2b==='f1_2' || a.p2b==='f3_5';
    const soPeitoSintoma = a.p2==='so_peito' && any(a.p3,['dorme_peito','muito_tempo','briga_recusa']);
    if(baixoPeso || queixaProd || media || soPeitoSintoma) return 'm_guia';
    const sono = a.p4==='cada_2h' || any(a.p5,['golinho','so_colo']) || any(a.p6,['acorda_noite','so_dorme_peito','organizar']);
    if(sono) return 'm_sono';
    return 'm_tudo_bem';
  }
  if(flow==='m6a12'){
    const pesoBom = a.p7==='bem' || a.p7==='super_bem';
    const introOk = a.p3==='bem' || a.p3==='nao_comecei';
    const introDif = a.p3==='aceita_pouco' || a.p3==='recusa';
    const dormeBem = a.p4==='nao' && !any(a.p5,['golinhos','so_colo']);
    const leiteBaixoDia = a.p8==='uma_duas' || a.p8==='nao_oferece_dia';
    const acordaNoite = a.p4==='algumas' || a.p4==='cada_2h';
    const sinaisSono = a.p4==='cada_2h' || any(a.p5,['golinhos','so_colo']);
    if(pesoBom && introOk && dormeBem) return 'm6_tudo_dez';
    if(pesoBom && introDif && dormeBem) return 'm6_intro';
    if(leiteBaixoDia && acordaNoite) return 'm6_cruzamento';
    if(sinaisSono) return 'm6_sono';
    return 'm6_intro';
  }
  if(flow==='gestante'){
    return has(a.p4,'cuidar_rn') ? 'g_guia_calminho' : 'g_guia';
  }
}

/* ============================ ENGINE ==================================== */
let state = { flow:null, answers:{}, order:[], pos:0 };
const $ = id => document.getElementById(id);

function renderWelcome(){
  state = { flow:null, answers:{}, order:['__idade__'], pos:0 };
  $('prog-fill').style.width='0%';
  $('btn-back').style.display='none';
  $('content').innerHTML = `
    <div class="screen welcome">
      <h1 class="title">Será que meu bebê<br>está mamando bem?</h1>
      <p class="lead">Responda algumas perguntas rápidas e descubra o que os sinais do seu bebê estão te contando, e o que fazer a respeito.</p>
      <img class="hero-img" src="assets/hero.webp" alt="Bebê mamando no peito">
      <button class="btn btn-verde" onclick="startQuiz()">Começar o quiz</button>
    </div>`;
}

function startQuiz(){
  state = { flow:null, answers:{}, order:['__idade__'], pos:0 };
  render();
}

/* perguntas visíveis do fluxo atual (respeita showIf) */
function visibleQuestions(){
  if(!state.flow) return [];
  return FLOWS[state.flow].filter(q => !q.showIf || q.showIf(state.answers));
}

/* pergunta atual (idade é especial) */
function currentQ(){
  if(state.order[state.pos]==='__idade__') return IDADE;
  const vis = visibleQuestions();
  return vis[state.pos - 1]; // pos 0 = idade; 1.. = perguntas do fluxo
}

function progressInfo(){
  if(state.order[state.pos]==='__idade__') return {pct:5, label:'Pra começar'};
  const vis = visibleQuestions();
  const total = vis.length + 1;      // +1 = idade
  const step = state.pos + 1;
  const label = step>=total ? 'Última pergunta' : `Pergunta ${step} de ${total}`;
  return {pct: Math.round((step-1)/total*100)+5, label};
}

function render(){
  const q = currentQ();
  if(!q){ finish(); return; }
  const p = progressInfo();
  $('prog-fill').style.width = p.pct + '%';
  $('btn-back').style.display = 'flex';

  let opts='';
  if(q.type==='single'){
    const cur = state.answers[q.id];
    opts = `<div class="options">` + q.options.map(o=>`
      <button class="opt ${cur===o.v?'sel':''}" onclick="pickSingle('${q.id}','${o.v}',this)">
        <span class="radio"><span class="dot"></span></span><span class="otext">${o.label}</span>
      </button>`).join('') + `</div>`;
  }
  else if(q.type==='multi'){
    const cur = state.answers[q.id]||[];
    opts = `<div class="options">` + q.options.map(o=>`
      <button class="opt ${cur.includes(o.v)?'sel':''}" onclick="toggleMulti('${q.id}','${o.v}',${q.max||0},this)">
        <span class="radio sq"><span class="dot"></span></span><span class="otext">${o.label}</span>
      </button>`).join('') + `</div>
      <button id="contBtn" class="btn btn-verde btn-cont" onclick="goNext()" ${cur.length?'':'disabled'}>Continuar</button>`;
  }
  else if(q.type==='foto'){
    const cur = state.answers[q.id];
    opts = `<div class="foto-ref">🖼️ ${q.foto}</div>
      <div class="foto-row">
        <button class="opt ${cur==='sim'?'sel':''}" onclick="pickSingle('${q.id}','sim',this)"><span class="radio"><span class="dot"></span></span><span class="otext">Sim</span></button>
        <button class="opt ${cur==='nao'?'sel':''}" onclick="pickSingle('${q.id}','nao',this)"><span class="radio"><span class="dot"></span></span><span class="otext">Não</span></button>
      </div>`;
  }

  $('content').innerHTML = `
    <div class="screen">
      <p class="step-label">${p.label}</p>
      <h2 class="q-title">${q.text}</h2>
      ${q.hint?`<p class="q-hint">${q.hint}</p>`:`<div class="q-gap"></div>`}
      ${opts}
    </div>`;
}

function pickSingle(qid, v, el){
  state.answers[qid]=v;
  if(qid==='idade'){ state.flow=v; }
  // mostra a seleção antes de avançar (feito no padrão do perfis)
  if(el){ el.parentElement.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); el.classList.add('sel'); }
  setTimeout(goNext, 260);
}

function toggleMulti(qid, v, max, el){
  const arr = state.answers[qid] ? [...state.answers[qid]] : [];
  const i = arr.indexOf(v);
  if(i>=0) arr.splice(i,1);
  else { if(max && arr.length>=max) return; arr.push(v); }
  state.answers[qid]=arr;
  el.classList.toggle('sel', arr.includes(v));
  const btn = $('contBtn'); if(btn) btn.disabled = arr.length===0;
}

function goNext(){ state.pos++; render(); }

function goBack(){
  if(state.pos===0){ renderWelcome(); return; }
  state.pos--;
  render();
}

/* ---- MOTOR DE FAIXAS (Fluxo 2, seção 4: classes e pesos) ---- */
/* pouco leite (1A) não tem caixinha própria no quiz: gatilho provisório
   (P9 = produzir mais leite  OU  P3 = fica horas / larga e quer = "nunca enche").
   A validar com a Day. */
function poucoLeite(a){
  return a.p9==='produzir_leite' || any(a.p3,['horas_peito','larga_quer']);
}
function montaFaixas(a){
  const c1=[], c2=[], c3=[], c4=[];
  if(poucoLeite(a)) c1.push('pouco_leite');
  if(any(a.p6,['doendo','rachadura','sangrando'])) c1.push('dor');
  if(has(a.p6,'empedrados')) c1.push('empedrado');
  if(a.p7==='sim') c2.push('calo');
  if(a.p4==='menos4' || a.p4==='f4_5') c2.push('pouca_fralda');
  if(has(a.p6,'silicone')) c3.push('silicone');
  if(has(a.p6,'raynaud')) c3.push('raynaud');
  if(a.p8==='sim') c3.push('batom');
  const pesoAbaixo = a.p5==='pouco_abaixo' || a.p5==='bem_abaixo';
  if(pesoAbaixo) c4.push('peso_abaixo');

  const classes=[c1,c2,c3,c4];
  const sel=new Set();
  classes.forEach(c=>{ if(c.length) sel.add(c[0]); });
  let rank=1;
  while(sel.size<4){
    let added=false;
    for(const c of classes){ if(sel.size>=4) break; if(c[rank]){ sel.add(c[rank]); added=true; } }
    if(!added) break; rank++;
  }
  const ordem=[];
  classes.forEach(c=>c.forEach(f=>{ if(sel.has(f)) ordem.push(f); }));
  return ordem;
}

/* ---- FIM DO QUIZ ---- */
function finish(){
  const a = state.answers;
  const bucket = roteia(state.flow, a);
  window.__quizResult = { flow:state.flow, bucket, answers:a };

  // Fluxo 2 · Cat 2 / Cat 3 → página de resposta modular (com loading + redirect)
  if(state.flow==='rn' && ['rn_cat2_guia','rn_cat2_silicone','rn_cat3_acomp'].includes(bucket)){
    const cat = bucket==='rn_cat3_acomp' ? 'cat3' : 'cat2';
    const oferta = bucket==='rn_cat3_acomp' ? 'guia_acomp' : (bucket==='rn_cat2_silicone' ? 'guia_pesque' : 'guia');
    const params = new URLSearchParams({cat, oferta, enfase:a.p9||'', faixas:montaFaixas(a).join(',')});
    showLoading('resultado.html?'+params.toString());
    return;
  }
  renderEnd(bucket); // demais desfechos: hand-off por enquanto
}

const LOADING_MSGS = [
  'Analisando cada sinal que você marcou...',
  'Comparando com o que a Day já viu em milhares de mães...',
  'Montando o seu resultado...'
];
function showLoading(url){
  $('prog-fill').style.width='100%';
  $('btn-back').style.display='none';
  $('content').innerHTML = `
    <div class="screen loading">
      <div class="lua"><div class="pulse"></div><div class="h">🤍</div></div>
      <h2 class="lt">Analisando as suas respostas</h2>
      <p class="lm" id="loadMsg">${LOADING_MSGS[0]}</p>
      <div class="load-bar"><span id="loadFill"></span></div>
      <p class="load-tag">✨ Quase lá</p>
    </div>`;
  const fill = $('loadFill'), msg = $('loadMsg');
  const passos = [
    {t:200,pct:25,m:LOADING_MSGS[0]},
    {t:1300,pct:55,m:LOADING_MSGS[1]},
    {t:2600,pct:85,m:LOADING_MSGS[2]},
    {t:3400,pct:100,m:LOADING_MSGS[2]},
  ];
  passos.forEach(p=>setTimeout(()=>{
    if(fill) fill.style.width=p.pct+'%';
    if(msg && msg.textContent!==p.m){ msg.style.opacity=0; setTimeout(()=>{ msg.textContent=p.m; msg.style.opacity=1; },200); }
  }, p.t));
  setTimeout(()=>{ window.location.href=url; }, 3900);
}

function renderEnd(bucket){
  const d = DESFECHOS[bucket] || {emoji:'💚', titulo:'Prontinho!', caminho:'—', oferta:'—'};
  $('prog-fill').style.width='100%';
  $('btn-back').style.display='none';
  $('content').innerHTML = `
    <div class="screen end">
      <div class="emoji">${d.emoji}</div>
      <h1 class="title">${d.titulo}</h1>
      <p class="lead">Terminamos! Com base nas suas respostas, esse é o caminho que faz mais sentido pra vocês agora.</p>
      <div class="caminho">
        <div class="lbl">Caminho recomendado</div>
        <div class="nome">${d.oferta}</div>
      </div>
      <p class="devnote">A página de resposta desse desfecho entra em seguida (mesmo modelo modular).
        <br><span class="devbucket">desfecho: ${bucket}</span></p>
      <button class="btn-ghost" onclick="renderWelcome()">↻ refazer o quiz</button>
    </div>`;
}
